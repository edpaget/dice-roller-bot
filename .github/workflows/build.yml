name: Build and Push

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - roller_lang/**/*.rs
      - roller_discord/**/*.rs
      - roller_repl/**/*.rs
      - roller_lang/Cargo.toml
      - roller_discord/Cargo.toml
      - roller_repl/Cargo.toml
      - locales/app.yml
      - Cargo.toml
      - Cargo.lock
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: "x86_64-unknown-linux-musl"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "dice-roller-release"
      - name: Build
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          cargo build --release --verbose --target x86_64-unknown-linux-musl

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        env:
          REGISTRY: ghcr.io
          IMAGE_NAME: ${{ github.repository }}
          SHA_TAG: ${{ github.sha }}
        run: |
          docker build \
            -t $REGISTRY/$IMAGE_NAME:$SHA_TAG \
            -t $REGISTRY/$IMAGE_NAME:latest .
          docker push $REGISTRY/$IMAGE_NAME --all-tags
